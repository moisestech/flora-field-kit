<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">FLORA Field Kit workflow loop</title>
  <desc id="desc">Brief to Techniques to Run to Review to Chain to Case study</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#0c1015"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3dd6c6"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <text x="48" y="56" fill="#3dd6c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">FLORA FIELD KIT</text>
  <text x="48" y="96" fill="#e8e2d6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="600">Brief ’ reusable production system</text>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#e8e2d6">
    <rect x="48" y="160" width="160" height="72" rx="2" fill="#1e2834" stroke="#3dd6c6" stroke-opacity="0.45"/>
    <text x="128" y="192" text-anchor="middle" font-weight="600">1. Brief</text>
    <text x="128" y="214" text-anchor="middle" fill="#9aa3ad" font-size="12">Intake</text>

    <rect x="248" y="160" width="160" height="72" rx="2" fill="#1e2834" stroke="#9aa3ad" stroke-opacity="0.35"/>
    <text x="328" y="192" text-anchor="middle" font-weight="600">2. Techniques</text>
    <text x="328" y="214" text-anchor="middle" fill="#9aa3ad" font-size="12">Recommend</text>

    <rect x="448" y="160" width="160" height="72" rx="2" fill="#1e2834" stroke="#9aa3ad" stroke-opacity="0.35"/>
    <text x="528" y="192" text-anchor="middle" font-weight="600">3. Run</text>
    <text x="528" y="214" text-anchor="middle" fill="#9aa3ad" font-size="12">API / demo</text>

    <rect x="648" y="160" width="160" height="72" rx="2" fill="#1e2834" stroke="#9aa3ad" stroke-opacity="0.35"/>
    <text x="728" y="192" text-anchor="middle" font-weight="600">4. Review</text>
    <text x="728" y="214" text-anchor="middle" fill="#9aa3ad" font-size="12">Select</text>

    <rect x="848" y="160" width="160" height="72" rx="2" fill="#1e2834" stroke="#9aa3ad" stroke-opacity="0.35"/>
    <text x="928" y="192" text-anchor="middle" font-weight="600">5. Chain</text>
    <text x="928" y="214" text-anchor="middle" fill="#9aa3ad" font-size="12">Next Technique</text>

    <rect x="1048" y="160" width="104" height="72" rx="2" fill="#1f6f68" stroke="#3dd6c6"/>
    <text x="1100" y="192" text-anchor="middle" font-weight="600" font-size="13">6. Case</text>
    <text x="1100" y="214" text-anchor="middle" fill="#e8e2d6" font-size="11">Report</text>
  </g>
  <g stroke="#3dd6c6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M208 196 H240"/>
    <path d="M408 196 H440"/>
    <path d="M608 196 H640"/>
    <path d="M808 196 H840"/>
    <path d="M1008 196 H1040"/>
  </g>
  <text x="48" y="320" fill="#9aa3ad" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Diagram  not a product screenshot. Recruiters run this loop in demo mode without an API key.</text>
  <text x="48" y="360" fill="#9aa3ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">flora-field-kit.moises.tech · github.com/moisestech/flora-field-kit</text>
</svg>
